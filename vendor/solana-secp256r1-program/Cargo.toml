[package]
name = "solana-secp256r1-program"
version = "2.2.4"
edition = "2021"
description = "Pure-Rust stub for secp256r1 precompile (eliminates OpenSSL C build requirement on client builds)"

[features]
default = []
openssl-vendored = []

[dependencies]
bytemuck = { version = "1.14", features = ["derive"] }
solana-feature-set = "2.2.1"
solana-precompile-error = "2.2.1"
solana-sdk-ids = "2.2.1"

# ТЗ §8.6 — Alpha Layer defaults (illustrative until Этап 15 calibration)
alpha_layer:
  enabled: true
  alpha_window_ms: 4000
  probe_window_sec: 3
  min_buyers_for_concentration_check: 25
  concentration_multiplier_max: 3.0
  neutral_prior: 0.35

  dev_history:
    block_threshold: 0.50
    caution_low: 0.25
    label_drawdown_pct: 80
    label_cliff_window_sec: 90
    label_dev_sell_pct: 50
    label_delay_min: 60

  bundler:
    hard_max_pct:
      micro: 70
      small: 65
      medium: 60
      large: 55

  funder_cluster:
    hard_max_pct:
      micro: 60
      small: 55
      medium: 50
      large: 45
    wallet_age_fresh_threshold_min: 30

  soft_score:
    weights:
      bundler: 0.2
      fresh_wallet: 0.2
      funder_cluster: 0.2
      concentration: 0.2
      dev_history: 0.2
    alpha_size_floor:
      micro: 0.3
      small: 0.3
      medium: 0.25
      large: 0.2

  probe_scale:
    q_probe_default: 0.25
    delta_drift_estimate_pct: 5
    skip_probe_if_clean_and_below_p_star: true

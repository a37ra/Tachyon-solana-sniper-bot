[package]
name = "solbot-signer"
version = "0.1.0"
edition = "2021"

[dependencies]
solbot-common = { path = "../solbot-common" }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
uuid = { workspace = true }
chrono = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
solana-sdk = "1.18"
libc = "0.2"
base64 = "0.21"
bincode = "1.3"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1.3"
rand = "0.8"
serde_json = { workspace = true }
bs58 = "0.5"
rlimit = "0.10"

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
tonic-build = { workspace = true }

[package]
name = "solbot-strategy"
version = "0.1.0"
edition = "2021"

[dependencies]
solbot-common = { path = "../solbot-common" }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate"] }
uuid = { workspace = true }
chrono = { workspace = true }
solana-client = "1.18"
solana-sdk = "1.18"
solana-account-decoder = "1.18"
solana-transaction-status = "1.18"
spl-token = "3.5"
spl-associated-token-account = "2.3"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "5.5"
base64 = "0.21"
bincode = "1.3"
borsh = "0.10"
bytemuck = { version = "1.14", features = ["derive"] }
solana-pubsub-client = "1.18"
futures-util = "0.3"

[package]
name = "solbot-strategy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solbot-strategy"
path = "src/main.rs"

[[bin]]
name = "solbot-benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "stage_1_2_check"
path = "src/bin/stage_1_2_check.rs"

[[bin]]
name = "devnet_roundtrip"
path = "src/bin/devnet_roundtrip.rs"

[[bin]]
name = "helius_ws_debug"
path = "src/bin/helius_ws_debug.rs"

[[bin]]
name = "helius_logs_debug"
path = "src/bin/helius_logs_debug.rs"

[[bin]]
name = "performance_benchmark"
path = "src/bin/performance_benchmark.rs"

[[bin]]
name = "paper_pipeline_e2e"
path = "src/bin/paper_pipeline_e2e.rs"

[dependencies]
solbot-common = { path = "../solbot-common" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true, default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "migrate", "offline"] }
uuid = { workspace = true }
chrono = { workspace = true }

# Solana 2.0+ crates
solana-pubkey = { workspace = true }
solana-signer = { workspace = true }
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
solana-transaction = { workspace = true }
solana-message = { workspace = true }
solana-instruction = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-account-decoder = { workspace = true }
solana-transaction-status = { workspace = true }
solana-compute-budget = { workspace = true }
solana-program = { workspace = true }
solana-pubsub-client = { workspace = true }
solana-sdk = "2.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
solana-sdk-ids = "2.0"

# SPL crates
spl-token = { workspace = true }
spl-associated-token-account = { workspace = true }

# Yellowstone gRPC
yellowstone-grpc-client = { workspace = true }
yellowstone-grpc-proto = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
prost = { workspace = true }

tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "5.5"
base64 = "0.21"
bincode = "1.3"
borsh = "0.10"
bytemuck = { version = "1.14", features = ["derive"] }
futures-util = "0.3"
tokio-util = "0.7"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
dotenvy = "0.15"
tower = "0.4"
hyper = "1.0"
hyper-util = "0.1"
http = "1.0"
http-body-util = "0.1"
rand = "0.8"
bs58 = "0.5"

[build-dependencies]
tonic-build = { workspace = true }
prost-build = { workspace = true }

[dev-dependencies]
solbot-common = { path = "../solbot-common" }
tempfile = "3"

[workspace]
members = [
    "crates/solbot-common",
    "crates/solbot-strategy",
    "crates/solbot-signer",
    "crates/solbot-notify",
    "crates/solbot-telegram",
    "crates/solbot-cli"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Astra"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
sqlx = { version = "0.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "uuid", "chrono", "macros"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tonic = "0.11"
prost = "0.12"
tonic-build = "0.11"


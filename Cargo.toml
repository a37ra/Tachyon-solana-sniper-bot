[workspace]
members = [
    "crates/solbot-common",
    "crates/solbot-strategy",
    "crates/solbot-signer",
    "crates/solbot-notify",
    "crates/solbot-telegram",
    "crates/solbot-cli"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Astra"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
